[workspace]
resolver = "3"
members = ["app", "web", "ssh"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[workspace.dependencies]
app = { path = "app" }
ratatui = { version = "0.30", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
enum_glob_use = "deny"
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
